<!doctype html>
<html lang="pt">
<head>
  <title>Recuperar Password</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="shortcut icon" href="assets/images/Logo.png">
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/css/login.css">
  <link rel="stylesheet" href="src/css/sweetalertFinalVersion.css">
  <link rel="stylesheet" href="src/css/recover.css">
</head>

<body>
    <div class="section">
        <div class="container">
                        <div class="card-3d-wrap mx-auto">
                            <div class="card-3d-wrapper">

                                <div class="card-front">
                                    <div class="center-wrap">
                                        <div class="text-center">

                                            <h4 class="mb-3 pb-3">Recuperar Password</h4>

                                            <div class="form-group">
                                              <input type="email" id="emailRecuperar" class="form-style" placeholder="Email">
                                              <i class="input-icon uil uil-at"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                              <input type="password" id="novaPassword" class="form-style" placeholder="Nova Password">
                                              <i class="input-icon uil uil-lock-alt"></i>
                                              <i class="toggle-password uil uil-eye"></i>
                                            </div>

                                            <button type="button" class="btn mt-4 recuperar-btn">
                                              ATUALIZAR PASSWORD
                                            </button>

                                            <div class="mt-4">
                                              <a href="login.html" class="forgot-password">Voltar ao login</a>
                                            </div>

                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
            
        </div>
    </div>

<script src="src/js/lib/jquery3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="src/js/login.js"></script>
</body>
</html>
