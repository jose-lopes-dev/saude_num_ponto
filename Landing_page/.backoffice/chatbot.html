<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Chatbot - Completar Perfil</title>

      <link rel="shortcut icon" href="assets/images/Logo.png">

    <link rel="stylesheet" href="src/css/bootstrap.css">
    <link rel="stylesheet" href="src/css/chatbot.css">
</head>

<body class="chat-fullscreen">
<div class="chat-container shadow-lg animate__animated animate__fadeIn">

    <div class="chat-header d-flex px-4 py-3">
        <img src="assets/images/users/avatar-2.jpg" class="me-3 rounded-circle avatar-xs flex-shrink-0 status-dot" alt="user-pic">
        <h3 class="m-0 fw-bold mt-2">Assistente Virtual</h3>
    </div>

    <div id="chat" class="chat-body"></div>

    <div class="chat-input-area">
        <input type="text" id="msg" class="form-control chat-input" placeholder="Escreve a tua mensagem...">
        <button id="enviar" class="btn btn-success px-4">Enviar</button>
    </div>

</div>


<script src="src/js/lib/jquery3.6.0.min.js"></script>
<script src="src/js/lib/bootstrap.js"></script>
<script src="src/js/chatbot.js"></script>

</body>
</html>
