<!doctype html>
<html lang="pt">
<head>
  <title>Saúde Num Ponto</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <link rel="shortcut icon" href="assets/images/Logo.png">

  <link href="assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/css/login.css">
  <link rel="stylesheet" href="src/css/sweetalertFinalVersion.css">
</head>

<body>
    <div class="section">
        <div class="container">
            <div class="row full-height justify-content-center">
                <div class="col-12 text-center align-self-center py-3">
                    <div class="pt-sm-2 text-center">

                        <a href="../index.html" class="brand-link" aria-label="Voltar à Landing Page">
                            <img src="assets/images/Logo2.png" class="brand-logo" alt="Saúde Num Ponto">
                        </a>
                        <div class="login-toggle">
                            <h6 class="mb-0 pb-3">
                                <span id="lbl-login" class="active">Iniciar Sessão</span>
                                <span id="lbl-reg">Registar</span>
                            </h6>

                            <input class="checkbox" type="checkbox" id="reg-log" name="reg-log"/>
                            <label for="reg-log" aria-label="Alternar entre Iniciar Sessão e Registar"></label>
                        </div>

                        <div class="card-3d-wrap mx-auto" id="cardWrap">
                            <div class="card-3d-wrapper">

                                <!-- ====================== LOGIN ====================== -->
                                <div class="card-front" id="cardFront">
                                    <div class="center-wrap">
                                        <div class="text-center">
                                            <h4 class="mb-3 pb-3">Iniciar Sessão</h4>

                                            <div class="form-group">
                                                <input type="text" id="usernameLogin" class="form-style" placeholder="Email">
                                                <i class="input-icon uil uil-at"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="password" id="passwordLogin" class="form-style" placeholder="Password">
                                                <i class="input-icon uil uil-lock-alt"></i>
                                                <i class="toggle-password uil uil-eye"></i>
                                            </div>

                                            <button type="button" class="btn mt-4" onclick="login()">Iniciar Sessão</button>

                                            <div class="mt-4">
                                                <a href="recuperar_password.html" class="forgot-password">
                                                    Esqueceu a password?
                                                </a>
                                            </div>

                                        </div>
                                    </div>
                                </div>

                                <!-- ====================== REGISTAR ====================== -->
                                <div class="card-back" id="cardBack">
                                    <div class="center-wrap">
                                        <div class="text-center">

                                            <h4 class="mb-3 pb-3">Registar</h4>

                                            <div class="form-group">
                                                <input type="text" id="username" class="form-style" placeholder="Username">
                                                <i class="input-icon uil uil-user"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="text" id="nome" class="form-style" placeholder="Nome Completo">
                                                <i class="input-icon uil uil-user"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="tel" id="telefone" class="form-style" placeholder="Telefone" maxlength="9" inputmode="numeric">
                                                <i class="input-icon uil uil-phone"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="email" id="email" class="form-style" placeholder="Email">
                                                <i class="input-icon uil uil-at"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="date" id="dataNascimento" class="form-style">
                                                <i class="input-icon uil uil-calendar-alt"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="text" id="nif" class="form-style" placeholder="NIF" maxlength="9" inputmode="numeric">
                                                <i class="input-icon uil uil-file-alt"></i>
                                            </div>

                                            <div class="form-group mt-2">
                                                <input type="password" id="password" class="form-style" placeholder="Password">
                                                <i class="input-icon uil uil-lock-alt"></i>
                                                <i class="toggle-password uil uil-eye"></i>
                                            </div>

                                            <button type="button" class="btn mt-3" onclick="registaUser()">REGISTAR</button>

                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div> 

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="src/js/lib/jquery3.6.0.min.js"></script>
    <script src="assets/libs/sweetalert2/sweetalert2.min.js"></script>
    <script src="src/js/login.js"></script>

</body>
</html>
