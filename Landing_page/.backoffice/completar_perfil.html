<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Completar Perfil - All In One</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="src/css/completar_perfil.css">
</head>

<body>
  <div class="perfil-section">
    <div class="perfil-card">
      <h2>Completar Perfil</h2>
      <p>Antes de continuares, completa o teu perfil com os dados abaixo:</p>

      <div class="form-group">
        <label>Idade</label>
        <input type="number" id="idade" class="form-style" placeholder="Ex: 25" min="10" max="100">
      </div>

      <div class="form-group">
        <label>Peso (kg)</label>
        <input type="number" id="peso" class="form-style" placeholder="Ex: 70" step="0.1" min="30" max="250">
      </div>

      <div class="form-group">
        <label>Altura (cm)</label>
        <input type="number" id="altura" class="form-style" placeholder="Ex: 175" step="0.1" min="100" max="250">
      </div>

      <div class="form-group">
        <label>Objetivo</label>
        <select id="objetivo" class="form-style">
          <option value="">Seleciona o teu objetivo</option>
          <option value="Emagrecer">Emagrecer</option>
          <option value="Ganho de Massa">Ganho de Massa</option>
          <option value="Manter a Forma">Manter a Forma</option>
          <option value="Definição Muscular">Definição Muscular</option>
        </select>
      </div>

      <button type="button" class="btn-guardar" onclick="guardarPerfil()">Guardar e Continuar</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="src/js/completar_perfil.js"></script>
</body>
</html>
